services:
  # PostgreSQL Database (Free tier available)
  - type: pserv
    name: dominos-db
    plan: free

  # Backend API Service
  - type: web
    name: dominos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: dominos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: dominos-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dominos-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
