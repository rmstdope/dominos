# Publishes the app with accounts to the HostUp VPS: builds both images, pushes them to the GitHub
# container registry, copies deploy/compose.yaml to the server and restarts what changed. The API
# applies database migrations itself when it starts. See docs/deploy.md.
#
# Run by hand from the Actions tab until the switch-over; then it takes over from Deploy.
#
# Required repository configuration:
#   secrets:   VPS_HOST (address), VPS_SSH_KEY (private key of the deploy user),
#              VPS_KNOWN_HOSTS (the line `ssh-keyscan <host>` prints)
#   variables: VPS_SITE (the address to check afterwards, e.g. https://dominos.kurelid.se)
name: Deploy to VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write # to push the images

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse to publish anything but main
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" != "main" ]; then
            echo "::error::Refusing to deploy '$REF'. This workflow publishes the live site and runs only from main."
            exit 1
          fi

      - name: Check the server is configured
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SITE: ${{ vars.VPS_SITE }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing VPS_HOST(secret)"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY(secret)"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS(secret)"
          [ -n "$SITE" ] || missing="$missing VPS_SITE(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured to deploy. Missing:$missing. See docs/deploy.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to the container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Tagged with the commit, so a deploy can be traced and redone, and as latest, which is what
      # the server runs. Deploying an older commit again is a rollback.
      - name: Build and push the images
        env:
          SHA: ${{ github.sha }}
        run: |
          for image in api web; do
            docker build -f "deploy/$image.Dockerfile" \
              -t "$REGISTRY/dominos-$image:$SHA" -t "$REGISTRY/dominos-$image:latest" .
            docker push --all-tags "$REGISTRY/dominos-$image"
          done

      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Restart the stack on the server
        env:
          HOST: ${{ secrets.VPS_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh_opts="-i $HOME/.ssh/id_deploy -o BatchMode=yes"
          scp $ssh_opts deploy/compose.yaml "deploy@$HOST:/opt/dominos/compose.yaml"
          # The token goes over SSH's input, never on a command line, and is only good while this
          # job runs; the server logs out again right after pulling.
          printf '%s' "$TOKEN" | ssh $ssh_opts "deploy@$HOST" "cd /opt/dominos &&
            docker login ghcr.io -u '$ACTOR' --password-stdin &&
            docker compose pull --quiet; pulled=\$?; docker logout ghcr.io;
            [ \$pulled -eq 0 ] && docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180;
            status=\$?; docker image prune -f >/dev/null; exit \$status"

      - name: Check the site answers
        env:
          SITE: ${{ vars.VPS_SITE }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if [ "$(curl -fsS --max-time 15 "$SITE/api/health" | jq -r .ok 2>/dev/null)" = "true" ] &&
               curl -fsS --max-time 15 "$SITE/" | grep -q '<div id="root">'; then
              echo "::notice::Deployed to $SITE"
              exit 0
            fi
            echo "Attempt $attempt: $SITE is not answering yet"
            sleep 10
          done
          echo "::error::$SITE did not answer after the deploy. On the server: cd /opt/dominos && docker compose logs"
          exit 1
