# Builds the production images and runs deploy/smoke-test.sh against the whole stack (Caddy, the
# API, Postgres, the backup job) as docker compose runs it on the VPS. Ubuntu runners come with
# Docker, the compose plugin and jq, so nothing is installed.
name: Production stack

on:
  push:
    paths:
      - "deploy/**"
      - "packages/**"
      - "src/**"
      - "config/menu.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/production-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and test the stack
        run: deploy/smoke-test.sh
