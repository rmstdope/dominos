# Publishing the site to dominos.kurelid.se: mirror a build over SFTP to one.com with lftp, then
# check the live site is serving it.
#
# Where the build comes from depends on what started the run:
#   - a green CI run on main: the exact dist/ CI built and tested end to end, downloaded as is;
#   - a push that changes only config/menu.json (CI skips those): the menu is validated, then built;
#   - by hand: built from main after the unit tests pass.
#
# Required repository configuration:
#   secrets:   ONECOM_FTP_SERVER, ONECOM_FTP_USERNAME, ONECOM_FTP_PASSWORD
#   variables: ONECOM_FTP_SERVER_DIR (the directory the domain serves), ONECOM_SFTP_PORT (optional)

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/menu.json"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read # to download the build CI kept

# Serialised rather than cancelled: an interrupted upload leaves the site half-replaced.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # A push that touches config/menu.json alongside anything else also runs CI, and is published
  # when that goes green. Only a push that changes the menu and nothing else is published from here.
  menu-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      menu-only: ${{ steps.diff.outputs.menu-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List the files this push changed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "$changed"
          if [ "$changed" = "config/menu.json" ]; then
            echo "menu-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "menu-only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a menu-only push; CI runs and publishes it."
          fi

  deploy:
    needs: menu-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success' ||
        needs.menu-only.outputs.menu-only == 'true'
      )
    steps:
      # A failing step rather than a job-level `if`: a skipped job reports as success, and a deploy
      # that quietly did not happen is the failure this guard exists to prevent.
      - name: Refuse to publish anything but main
        env:
          REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [ "$REF" != "main" ]; then
            echo "::error::Refusing to deploy '$REF'. This workflow publishes the live site and runs only from main."
            exit 1
          fi
          echo "Publishing from main."

      - name: Check the publishing credentials are configured
        env:
          SERVER: ${{ secrets.ONECOM_FTP_SERVER }}
          USERNAME: ${{ secrets.ONECOM_FTP_USERNAME }}
          PASSWORD: ${{ secrets.ONECOM_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.ONECOM_FTP_SERVER_DIR }}
        run: |
          missing=""
          [ -n "$SERVER" ] || missing="$missing ONECOM_FTP_SERVER(secret)"
          [ -n "$USERNAME" ] || missing="$missing ONECOM_FTP_USERNAME(secret)"
          [ -n "$PASSWORD" ] || missing="$missing ONECOM_FTP_PASSWORD(secret)"
          [ -n "$SERVER_DIR" ] || missing="$missing ONECOM_FTP_SERVER_DIR(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured to publish. Missing:$missing"
            exit 1
          fi
          echo "Publishing to $SERVER_DIR"

      - name: Take the build CI tested
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v5

      - name: Setup Node
        if: github.event_name != 'workflow_run'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        if: github.event_name != 'workflow_run'
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        if: github.event_name != 'workflow_run'
        run: pnpm install --frozen-lockfile

      # A menu edit is checked against the menu's own rules only; a hand-started run gets the whole
      # unit suite. Neither needs a browser.
      - name: Validate the menu
        if: github.event_name == 'push'
        run: pnpm exec vitest run src/config/menu.test.ts

      - name: Unit and component tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run test

      - name: Build the site
        if: github.event_name != 'workflow_run'
        run: pnpm run build

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish over SFTP
        env:
          SERVER: ${{ secrets.ONECOM_FTP_SERVER }}
          USERNAME: ${{ secrets.ONECOM_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.ONECOM_FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.ONECOM_FTP_SERVER_DIR }}
          PORT: ${{ vars.ONECOM_SFTP_PORT || '22' }}
        run: |
          lftp -u "$USERNAME" --env-password "sftp://$SERVER:$PORT" <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --continue "dist/" "$SERVER_DIR"
          bye
          LFTP
          # No --delete: Vite names assets by content hash, so stale files are unreferenced, not
          # overwritten, and a browser still holding the previous index keeps working.

      - name: Check the site is serving what was uploaded
        run: |
          site="https://dominos.kurelid.se"
          expected="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)"
          for attempt in 1 2 3; do
            status="$(curl -sS -o page.html -w '%{http_code}' --max-time 30 "$site/" || echo 000)"
            [ "$status" = "200" ] && grep -q "$expected" page.html && break
            echo "Attempt $attempt: $site/ returned $status (looking for $expected)"
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "::error::$site/ returned $status. Is ONECOM_FTP_SERVER_DIR the directory this domain serves?"
            exit 1
          fi
          if ! grep -q "$expected" page.html; then
            echo "::error::$site/ answered, but is not serving this build ($expected not referenced)."
            exit 1
          fi
          echo "::notice::Published to $site"
