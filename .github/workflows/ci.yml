# Regression protection for every pull request and every push to main: lint, types, formatting,
# unit tests, a production build and end-to-end tests against that build served statically.
#
# Skipped when the only change is config/menu.json: that is the baker's content, not code. Such a
# push is published by the Deploy workflow directly, which still builds and verifies it end to end.
name: CI

on:
  pull_request:
    paths-ignore:
      - "config/menu.json"
  push:
    branches: [main]
    paths-ignore:
      - "config/menu.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Unit and component tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests against the static build
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
