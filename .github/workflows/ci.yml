name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          directory: backend/coverage
          flags: backend
          fail_ci_if_error: false

  backend-build:
    name: Backend - Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  backend-docker:
    name: Backend - Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: dominos-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container for health check
        run: |
          docker run -d -p 3000:3000 -e JWT_SECRET=ci-test-secret --name backend-test dominos-backend:ci
          sleep 5

      - name: Verify health endpoint
        run: |
          response=$(curl -s http://localhost:3000/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q '"status":"ok"'; then
            echo "✅ Container health check passed"
          else
            echo "❌ Container health check failed"
            docker logs backend-test
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker stop backend-test && docker rm backend-test

  backend-security:
    name: Backend - Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run npm audit
        working-directory: backend
        run: npm audit --audit-level=high

  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs:
      [
        backend-lint,
        backend-test,
        backend-build,
        backend-docker,
        backend-security,
      ]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "❌ CI Pipeline Failed - One or more jobs did not succeed"
            exit 1
          fi
          echo "✅ All CI checks passed successfully"
