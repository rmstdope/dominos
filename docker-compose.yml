services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dominos-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-in-production}
      - DATABASE_PATH=/app/data/database.sqlite
    volumes:
      # Persist database
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Development service (optional - use with docker-compose -f docker-compose.yml -f docker-compose.dev.yml up)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: dominos-backend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=dev-secret
      - DATABASE_PATH=/app/data/database.sqlite
    volumes:
      # Mount source code for live reload
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - backend-dev-data:/app/data
      - backend-node-modules:/app/node_modules
    command: npm run dev
    profiles:
      - dev

volumes:
  backend-data:
    driver: local
  backend-dev-data:
    driver: local
  backend-node-modules:
    driver: local
